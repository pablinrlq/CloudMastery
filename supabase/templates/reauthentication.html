<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5f9;padding:32px 16px"><tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border:1px solid #e2e8f0;border-radius:24px;overflow:hidden">
        <tr><td style="height:6px;background:#ff9900"></td></tr>
        <tr><td style="padding:34px 40px 10px"><img src="{{ .SiteURL }}/cloudmastery-logo.png" width="220" alt="Cloud Mastery" style="display:block;max-width:100%;height:auto"></td></tr>
        <tr><td style="padding:18px 40px 40px">
          <p style="margin:0 0 10px;color:#f97316;font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase">Verificação de segurança</p>
          <h1 style="margin:0 0 16px;font-size:30px;line-height:1.18">Confirme que é você</h1>
          <p style="margin:0 0 20px;color:#475569;font-size:16px;line-height:1.7">Use o código abaixo para concluir a operação sensível na Cloud Mastery.</p>
          <div style="display:inline-block;background:#0f172a;color:#fff;font-size:30px;font-weight:700;letter-spacing:8px;padding:16px 22px;border-radius:12px">{{ .Token }}</div>
          <p style="margin:28px 0 0;color:#64748b;font-size:13px;line-height:1.6">Nunca compartilhe este código. Se não iniciou a operação, altere sua senha.</p>
        </td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
