<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5f9;padding:32px 16px"><tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border:1px solid #e2e8f0;border-radius:24px;overflow:hidden">
        <tr><td style="height:6px;background:#ff9900"></td></tr>
        <tr><td style="padding:34px 40px 10px"><img src="{{ .SiteURL }}/cloudmastery-logo.png" width="220" alt="Cloud Mastery" style="display:block;max-width:100%;height:auto"></td></tr>
        <tr><td style="padding:18px 40px 40px">
          <p style="margin:0 0 10px;color:#f97316;font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase">Alteração de conta</p>
          <h1 style="margin:0 0 16px;font-size:30px;line-height:1.18">Confirme seu novo email</h1>
          <p style="margin:0 0 26px;color:#475569;font-size:16px;line-height:1.7">Confirme a alteração do endereço da sua conta Cloud Mastery para <strong>{{ .NewEmail }}</strong>.</p>
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#ff9900;color:#111827;text-decoration:none;font-weight:700;font-size:15px;padding:15px 24px;border-radius:12px">Confirmar novo email</a>
          <p style="margin:28px 0 0;color:#64748b;font-size:13px;line-height:1.6">Não reconhece esta solicitação? Não clique e revise a segurança da sua conta.</p>
        </td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
