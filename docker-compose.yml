# version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres        
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: cloudmastery
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
    restart: always

volumes:
  pgdata:
